services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_ops
    ports:
      - "5433:5432"
    volumes:
      - seo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: ["web"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_ops?schema=public
      APP_BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-phase2-local-dev-secret-change-me-32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OWNER_EMAILS: ${OWNER_EMAILS:-owner@example.com}
      WEB_ORIGIN: http://localhost:3000
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    # GSC SA key: use docker-compose.gsc.yml override (never bake into image).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    command: ["worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_ops?schema=public
      APP_BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-phase2-local-dev-secret-change-me-32chars}
      OWNER_EMAILS: ${OWNER_EMAILS:-owner@example.com}
      WEB_ORIGIN: http://localhost:3000
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      WORKER_IDLE_MS: ${WORKER_IDLE_MS:-60000}
      GSC_INGEST_INTERVAL_MS: ${GSC_INGEST_INTERVAL_MS:-21600000}
      GSC_INGEST_ON_START: ${GSC_INGEST_ON_START:-true}
      GSC_ROW_LIMIT: ${GSC_ROW_LIMIT:-5000}
      GSC_MAX_DAYS_PER_RUN: ${GSC_MAX_DAYS_PER_RUN:-28}
      GSC_INITIAL_BACKFILL_DAYS: ${GSC_INITIAL_BACKFILL_DAYS:-28}
      GSC_INSPECT_INTERVAL_MS: ${GSC_INSPECT_INTERVAL_MS:-604800000}
      GSC_INSPECT_FRESHNESS_MS: ${GSC_INSPECT_FRESHNESS_MS:-604800000}
      GSC_INSPECT_ON_START: ${GSC_INSPECT_ON_START:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  seo_pg_data:
